# The gate, on every push.
#
# `npm run verify -- --full` is the same command a developer runs locally and
# the same one .claude/commands/improve.md requires before a commit — so CI
# cannot drift from what people actually run. If a gate is worth adding, it goes
# in tools/verify.mjs and arrives here for free.
name: verify

on:
  push:
    branches: ['**']
  pull_request:
  # Lets a red run be retried from the Actions tab without an empty commit.
  workflow_dispatch:

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Generous, but a hung Playwright run should not burn 6 hours of the
    # default before anyone notices.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json requires >=22.12.0; 24 is what the work is done on.
          node-version: 24
          cache: npm

      # esbuild's postinstall is what unpacks its platform binary, and npm 11
      # blocks install scripts by default — without it every Vite-backed command
      # fails before doing any work. package.json's `allowScripts` approves that
      # one package, which is why this is a plain `npm ci` and not `--ignore-scripts`
      # plus a workaround.
      - run: npm ci

      # Chromium only: both Playwright projects use it (Desktop Chrome and
      # Pixel 5). `--with-deps` installs the system libraries the runner lacks.
      - run: npx playwright install --with-deps chromium

      # typecheck, unit tests, the admin seam, catalogue shape, build, the
      # output sweeps, the CSP hashes, robots.txt, and the e2e suite.
      - run: npm run verify -- --full

      # Only on failure: the report is the fastest way to see which of 137 e2e
      # tests went red and what the page looked like when it did.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
